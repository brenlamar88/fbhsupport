<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Behavioral Health — Technology Hub</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;font-size:14px;overflow-x:hidden}
  a{text-decoration:none}
  .hub{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem}
  .header{margin-bottom:1.75rem;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
  .header-left h1{font-size:20px;font-weight:600;color:#1a1a1a}
  .header-left p{font-size:13px;color:#666;margin-top:3px}
  .header-right{font-size:12px;color:#888;text-align:right}
  .section-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:1.75rem}
  .tool-card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,border-color .15s}
  .tool-card:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .tool-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .tool-name{font-size:13px;font-weight:600;color:#1a1a1a}
  .tool-desc{font-size:11px;color:#888;line-height:1.4}
  .form-wrap{max-width:560px}
  .card{background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:1.5rem;min-width:0;overflow:hidden}
  .form-row{margin-bottom:12px}
  .form-label{font-size:12px;color:#555;margin-bottom:5px;display:block;font-weight:500}
  input,select,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.08)}
  textarea{resize:vertical;min-height:90px;line-height:1.5}
  .btn{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#1a1a1a;transition:background .15s;font-family:inherit}
  .btn:hover{background:#f5f5f3}
  .btn:active{transform:scale(.99)}
  .btn-primary{background:#185FA5;color:#fff;border-color:#185FA5}
  .btn-primary:hover{background:#0d4f8f}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dropdown-card{cursor:pointer;position:relative;user-select:none}
  .chevron{font-size:12px;color:#888;transition:transform .2s;display:inline-block}
  .dropdown-card.open .chevron{transform:rotate(180deg)}
  .dropdown-menu{display:none;flex-direction:column;margin-top:8px;border-top:1px solid #e5e5e3;padding-top:8px;gap:2px}
  .dropdown-card.open .dropdown-menu{display:flex}
  .dropdown-item{font-size:12px;color:#185FA5;padding:5px 8px;border-radius:6px;transition:background .12s;text-decoration:none}
  .dropdown-item:hover{background:#E6F1FB}
  .toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;max-width:280px}
  .toast.show{opacity:1}
  .toast.error{background:#A32D2D}
  .toast.success{background:#3B6D11}

  /* ── SUCCESS STATE ── */
  .success-card{display:none;background:#fff;border:1px solid #e5e5e3;border-radius:12px;padding:2rem;text-align:center;max-width:560px}
  .success-card.show{display:block}
  .success-icon{font-size:40px;margin-bottom:12px}
  .success-title{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:8px}
  .success-msg{font-size:13px;color:#666;line-height:1.6;margin-bottom:20px}
  .success-detail{background:#f5f5f3;border-radius:8px;padding:12px;font-size:12px;color:#555;text-align:left;margin-bottom:20px;line-height:1.8}
  .success-detail strong{color:#1a1a1a}
  .btn-sm-outline{width:auto;padding:7px 16px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:inherit;color:#1a1a1a;transition:background .15s}
  .btn-sm-outline:hover{background:#f5f5f3}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
const CONFIG = {
  AIRTABLE_TOKEN: 'patz8kSMjhVRGMzp6.3aa05554e02233d38e547fba584b4d047385aee6af6ff06758256b813a840488',
  AIRTABLE_BASE_ID: 'appOQI2Im5XebeIyg',
  AIRTABLE_TABLE: 'tblEMz0BecYmu48y0',
  // ── EMAIL (EmailJS) ── Sends a confirmation email to the person who submits
  // a ticket. Create a second EmailJS template (e.g. "ticket confirmation") and
  // paste its ID into CONFIRM_TEMPLATE_ID below. Leave it '' to disable.
  // Template variables sent: {{to_email}} (set as the template's To Email),
  // {{to_name}}, {{ref}}, {{subject}}, {{facility}}, {{tool}}, {{priority}}, {{issue}}.
  EMAILJS: {
    SERVICE_ID: 'service_ucspnwu',
    PUBLIC_KEY: 'BbYLdPAgSRvGaUdGq',
    CONFIRM_TEMPLATE_ID: '',                 // requester confirmation (create + paste ID)
    ASSIGN_TEMPLATE_ID: 'template_i1zrsar',  // assignee notification (existing template)
  },
  // ── AUTO-ROUTING ── When a ticket is submitted it is auto-assigned to an
  // owner and that owner is emailed immediately. Precedence: BY_TOOL → BY_FACILITY
  // → DEFAULT. Fill in the maps below with real owners; anything unlisted goes to
  // DEFAULT. Set ENABLED:false to turn auto-routing off.
  ROUTING: {
    ENABLED: true,
    DEFAULT: 'broberts@freedomhc.com',   // everything else → Bren Roberts
    BY_TOOL: {
      'BlackOps': 'broberts@freedomhc.com',        // Bren
      'SharePoint': 'bryder@freedomhc.com',         // Braden
      'Email': 'support@freedomhc.com',
      'Other / General IT': 'support@freedomhc.com',
    },
    BY_FACILITY: {
      // 'Monroe': 'someone@freedomhc.com',
    },
  },
  // Name lookup for email greetings (mirror of admin TEAM).
  TEAM: [
    { name:'Bren Roberts',  email:'broberts@freedomhc.com' },
    { name:'Braden Ryder',  email:'bryder@freedomhc.com' },
    { name:'IT Support',    email:'support@freedomhc.com' },
    { name:'Help Desk',     email:'helpdesk@freedomhc.com' },
  ],
  TOOLS: [
    { name:'BlackOps', desc:'Operations CRM', icon:'🖥', bg:'#E6F1FB', dropdown:true, locations:['Monroe','Magnolia','Bastrop','Bunkie','Minden','Dequincy','Plainview','Greenville','Villeplatte','Ferriday','Leesville','LakeCharles'] },
    { name:'Broken Process', url:'https://freedombehavioral.vercel.app', desc:'Report broken workflows', icon:'⚠️', bg:'#FAEEDA' },
    { name:'RAP', url:'https://rap.freedomhc.com', desc:'Digital RAP system', icon:'📋', bg:'#EAF3DE' },
    { name:'PIP', url:'https://pip.v8techco.com', desc:'Performance improvement', icon:'📈', bg:'#EEEDFE' },
    { name:'POP', url:'https://freedom.v8techco.com', desc:'Outcomes & planning', icon:'📊', bg:'#FBEAF0' },
  ]
};
</script>

<div class="hub">
  <div class="header">
    <div class="header-left">
      <h1>Freedom Behavioral Health — Technology Hub</h1>
      <p>Quick access to tools &amp; support ticket submission</p>
    </div>
    <div class="header-right" id="last-updated"></div>
  </div>

  <div class="section-label">Tools &amp; Applications</div>
  <div class="tools-grid" id="tools-grid"></div>

  <div class="section-label">Submit a Support Ticket</div>

  <!-- FORM -->
  <div class="form-wrap">
    <div class="card" id="form-card">
      <div class="form-row">
        <label class="form-label">Your name</label>
        <input type="text" id="f-name" placeholder="Full name">
      </div>
      <div class="form-row">
        <label class="form-label">Your email</label>
        <input type="email" id="f-email" placeholder="your@email.com">
      </div>
      <div class="form-row">
        <label class="form-label">Facility</label>
        <select id="f-facility">
          <option value="">Select facility...</option>
          <option>Corporate</option><option>Monroe</option><option>Magnolia</option><option>Bastrop</option>
          <option>Bunkie</option><option>Minden</option><option>Dequincy</option><option>Plainview</option>
          <option>Greenville</option><option>Ville Platte</option><option>Ferriday</option>
          <option>Leesville</option><option>Lake Charles</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Tool / system</label>
        <select id="f-tool">
          <option value="">Select a tool...</option>
          <option>BlackOps</option><option>Broken Process</option><option>RAP</option><option>PIP</option>
          <option>POP</option><option>SharePoint</option><option>NetSfere</option><option>Email</option><option>Other / General IT</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Subject</label>
        <input type="text" id="f-subject" placeholder="Brief summary of the issue">
      </div>
      <div class="form-row">
        <label class="form-label">Issue description</label>
        <textarea id="f-issue" placeholder="Describe the problem in detail..."></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">Priority</label>
        <select id="f-priority">
          <option value="Low">Low — not blocking work</option>
          <option value="Medium" selected>Medium — slowing work down</option>
          <option value="High">High — blocking multiple people</option>
          <option value="Urgent">Urgent — system down</option>
        </select>
      </div>
      <button class="btn btn-primary" id="submit-btn" onclick="submitTicket()">
        Submit Ticket
      </button>
    </div>

    <!-- SUCCESS CONFIRMATION -->
    <div class="success-card" id="success-card">
      <div class="success-icon">✅</div>
      <div class="success-title">Ticket Submitted!</div>
      <div class="success-msg">Your support ticket has been received. The Freedom Support Team will review your request and get back to you shortly.</div>
      <div class="success-detail" id="success-detail"></div>
      <button class="btn-sm-outline" onclick="resetForm()">Submit Another Ticket</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', () => { renderTools(); setLastUpdated(); });

function setLastUpdated() {
  const now = new Date();
  document.getElementById('last-updated').textContent =
    now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) + ' · ' +
    now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function renderTools() {
  const grid = document.getElementById('tools-grid');
  grid.innerHTML = CONFIG.TOOLS.map(t => {
    if (t.dropdown) {
      const items = t.locations.map(loc => {
        const slug = loc.toLowerCase().replace(/\s/g,'');
        const label = loc.replace(/([A-Z])/g,' $1').trim();
        return `<a class="dropdown-item" href="https://${slug}.blkops.com" target="_blank" rel="noopener">${label}</a>`;
      }).join('');
      return `<div class="tool-card dropdown-card" onclick="toggleDropdown(event,this)">
        <div class="tool-icon" style="background:${t.bg}">${t.icon}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="tool-name">${t.name}</div><span class="chevron">▾</span>
        </div>
        <div class="tool-desc">${t.desc}</div>
        <div class="dropdown-menu">${items}</div>
      </div>`;
    }
    return `<a class="tool-card" href="${t.url}" target="_blank" rel="noopener">
      <div class="tool-icon" style="background:${t.bg}">${t.icon}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
    </a>`;
  }).join('');
}

function toggleDropdown(e, card) {
  e.stopPropagation();
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.dropdown-card.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) card.classList.add('open');
}
document.addEventListener('click', () => { document.querySelectorAll('.dropdown-card.open').forEach(c => c.classList.remove('open')); });

const AT_BASE = `https://api.airtable.com/v0/${CONFIG.AIRTABLE_BASE_ID}/${encodeURIComponent(CONFIG.AIRTABLE_TABLE)}`;
const AT_HEADERS = { 'Authorization': `Bearer ${CONFIG.AIRTABLE_TOKEN}`, 'Content-Type': 'application/json' };

async function submitTicket() {
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const facility = document.getElementById('f-facility').value;
  const tool = document.getElementById('f-tool').value;
  const subject = document.getElementById('f-subject').value.trim();
  const issue = document.getElementById('f-issue').value.trim();
  const priority = document.getElementById('f-priority').value;

  if (!name || !email || !facility || !tool || !subject || !issue) {
    showToast('Please fill in all fields.', 'error'); return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Submitting...';

  // Auto-routing: decide the owner for this ticket (Tool → Facility → default).
  const r = CONFIG.ROUTING;
  const assignee = (r && r.ENABLED)
    ? (r.BY_TOOL[tool] || r.BY_FACILITY[facility] || r.DEFAULT || '')
    : '';

  const baseFields = {
    "Subject": subject, "Email": email, "Issue": issue,
    "Priority": priority, "Status": "Open", "Facility": facility,
    "Tool": tool, "Date Submitted": new Date().toISOString().split('T')[0]
  };
  if (assignee) baseFields["Assigned To"] = assignee;

  async function createRecord(fields) {
    const res = await fetch(AT_BASE, { method:'POST', headers:AT_HEADERS, body:JSON.stringify({fields}) });
    if (!res.ok) {
      let type=''; try { type=(await res.json())?.error?.type||''; } catch(_){}
      const err = new Error(`Airtable ${res.status}`); err.type=type; throw err;
    }
    return res.json();
  }

  try {
    let record;
    try {
      // Include the submitter's name so admins see a person, not just an email.
      record = await createRecord({ ...baseFields, "Name": name });
    } catch(e) {
      // If the base has no "Name" field yet, don't fail the submission — retry
      // without it. (Add a "Name" single-line-text field in Airtable to store it.)
      if (e.type === 'UNKNOWN_FIELD_NAME') record = await createRecord(baseFields);
      else throw e;
    }

    // Human-friendly reference from the created record id.
    const ref = record?.id ? record.id.slice(-6).toUpperCase() : '';

    // Send a confirmation email to the requester (if EmailJS is configured).
    if (CONFIG.EMAILJS.CONFIRM_TEMPLATE_ID && window.emailjs) {
      emailjs.send(CONFIG.EMAILJS.SERVICE_ID, CONFIG.EMAILJS.CONFIRM_TEMPLATE_ID, {
        to_email: email, to_name: name, ref, subject, facility, tool, priority, issue
      }, { publicKey: CONFIG.EMAILJS.PUBLIC_KEY }).catch(()=>{});
    }

    // Notify the auto-assigned owner immediately (if EmailJS is configured).
    if (assignee && CONFIG.EMAILJS.ASSIGN_TEMPLATE_ID && window.emailjs) {
      const ownerName = teamName(assignee);
      const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const message = [
        `Hi ${ownerName||'there'},`,'',
        `A new support ticket (Ref ${ref}) has been auto-assigned to you:`,'',
        `From:     ${name} <${email}>`,
        `Facility: ${facility}`,
        `Tool:     ${tool}`,
        `Priority: ${priority}`,'',
        `Subject: ${subject}`,'',
        'Issue:', issue,'',
        '— Freedom Behavioral Health · Technology Hub'
      ].join('\n');
      const rows = [
        ['Reference', ref], ['From', `${name} <${email}>`], ['Facility', facility],
        ['Tool / System', tool], ['Priority', priority], ['Status', 'Open'],
      ];
      const message_html = `
<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#1a1a1a;line-height:1.5">
  <p style="margin:0 0 12px">Hi ${esc(ownerName||'there')},</p>
  <p style="margin:0 0 12px">A new support ticket has been auto-assigned to you.</p>
  <table style="border-collapse:collapse;margin:0 0 14px">
    ${rows.map(([k,v])=>`<tr><td style="padding:4px 16px 4px 0;color:#888;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:4px 0;font-weight:600">${esc(v||'—')}</td></tr>`).join('')}
  </table>
  <p style="margin:0 0 3px;color:#888;font-size:12px;text-transform:uppercase;letter-spacing:.05em">Subject</p>
  <p style="margin:0 0 14px">${esc(subject)}</p>
  <p style="margin:0 0 3px;color:#888;font-size:12px;text-transform:uppercase;letter-spacing:.05em">Issue</p>
  <p style="margin:0;white-space:pre-wrap">${esc(issue)}</p>
  <hr style="border:none;border-top:1px solid #e5e5e3;margin:16px 0">
  <p style="margin:0;color:#888;font-size:12px">Freedom Behavioral Health · Technology Hub</p>
</div>`.trim();
      emailjs.send(CONFIG.EMAILJS.SERVICE_ID, CONFIG.EMAILJS.ASSIGN_TEMPLATE_ID, {
        to_email: assignee, to_name: ownerName||assignee,
        subject: `[FBH Support] ${priority} — ${subject} (${facility})`,
        message, message_html, cc_email: email, reply_to: email,
        facility, tool, priority, status:'Open',
        requester_email: email, date_submitted: baseFields['Date Submitted'],
        ticket_subject: subject, issue,
      }, { publicKey: CONFIG.EMAILJS.PUBLIC_KEY }).catch(()=>{});
    }

    // Show success
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-detail').innerHTML =
      `${ref?`<strong>Reference #:</strong> ${ref}<br>`:''}
       <strong>Name:</strong> ${name}<br>
       <strong>Facility:</strong> ${facility}<br>
       <strong>Tool:</strong> ${tool}<br>
       <strong>Subject:</strong> ${subject}<br>
       <strong>Priority:</strong> ${priority}<br>
       <strong>Submitted:</strong> ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
    document.getElementById('success-card').classList.add('show');

  } catch(e) {
    showToast('Submission failed. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Submit Ticket';
  }
}

function resetForm() {
  ['f-name','f-email','f-facility','f-tool','f-subject','f-issue'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-priority').value = 'Medium';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Submit Ticket';
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('success-card').classList.remove('show');
}

function teamName(emailAddr) {
  const m = (CONFIG.TEAM||[]).find(t => t.email === emailAddr);
  return m ? m.name : '';
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}
</script>
</body>
</html>

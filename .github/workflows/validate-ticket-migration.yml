name: Validate ticket migration

on:
  pull_request:
    paths:
      - 'api/**'
      - 'test/**'
      - 'package.json'
      - 'admin.html'
      - 'index.html'
      - '.github/workflows/validate-ticket-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find api -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Unit tests (mocked; no database or email keys)
        env:
          DISABLE_NOTIFICATIONS: 'true'
          ENABLE_AI_TRIAGE: 'false'
        run: npm test
